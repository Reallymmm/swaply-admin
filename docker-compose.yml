services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-swaply}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-swaply_pass}
      POSTGRES_DB: ${POSTGRES_DB:-swaply}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-swaply}:${POSTGRES_PASSWORD:-swaply_pass}@db:5432/${POSTGRES_DB:-swaply}
    ports:
      - "8000:8000"
    volumes:
      - ./backend/uploads:/app/backend/uploads

volumes:
  pgdata:
