<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Апелляции — Swaply Admin</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="appeals">

  <div class="sidebar">
    <h2 class="logo">Swaply</h2>
    <ul class="menu">
      <li><a href="index.html">Обзор</a></li>
      <li><a href="listings.html">Объявления</a></li>
      <li><a href="users.html">Пользователи</a></li>
      <li><a href="reviews.html">Отзывы</a></li>
      <li><a href="appeals.html" class="current">Апелляции</a></li>
      <li><a href="categories.html">Категории</a></li>
    </ul>
  </div>

  <div class="main">

    <div class="header">
      <span>Панель администратора</span>
      <span>Поп Я.В.</span>
    </div>

    <div class="page">
      <h1>Апелляции</h1>
<p class="filter">Показать:
        <select id="filter">
          <option value="pending">На рассмотрении</option>
          <option value="">Все</option>
          <option value="approved">Одобренные</option>
          <option value="rejected">Отклонённые</option>
        </select>
      </p>

      <p id="error" class="empty hidden">Не удалось связаться с сервером. Проверь, что бэкенд запущен.</p>
      <table>
        <thead>
          <tr><th>Дата</th><th>Пользователь</th><th>Причина блокировки</th><th>Апелляция</th><th>Статус</th><th>Действия</th></tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
