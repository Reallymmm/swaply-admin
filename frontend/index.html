<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Обзор — Swaply Admin</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="dashboard">

  <div class="sidebar">
    <h2 class="logo">Swaply</h2>
    <ul class="menu">
      <li><a href="index.html" class="current">Обзор</a></li>
      <li><a href="listings.html">Объявления</a></li>
      <li><a href="users.html">Пользователи</a></li>
      <li><a href="categories.html">Категории</a></li>
    </ul>
  </div>

  <div class="main">

    <div class="header">
      <span>Панель администратора</span>
      <span>Поп Я.В.</span>
    </div>

    <div class="page">
      <h1>Обзор</h1>

      <p id="error" class="empty hidden">Не удалось связаться с сервером. Проверь, что бэкенд запущен.</p>

      <div class="stats">
        <div class="box">
          <p>Пользователи</p>
          <b id="stat-users">…</b>
        </div>
        <div class="box">
          <p>Активные объявления</p>
          <b id="stat-active">…</b>
        </div>
        <div class="box">
          <p>На модерации</p>
          <b id="stat-review">…</b>
        </div>
        <div class="box">
          <p>Заблокированные</p>
          <b id="stat-blocked">…</b>
        </div>
      </div>

      <h2>Последние объявления</h2>
      <table>
        <thead>
          <tr>
            <th>Название</th>
            <th>Автор</th>
            <th>Статус</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
