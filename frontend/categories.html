<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Категории — Swaply Admin</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="categories">

  <div class="sidebar">
    <h2 class="logo">Swaply</h2>
    <ul class="menu">
      <li><a href="index.html">Обзор</a></li>
      <li><a href="listings.html">Объявления</a></li>
      <li><a href="users.html">Пользователи</a></li>
      <li><a href="categories.html" class="current">Категории</a></li>
    </ul>
  </div>

  <div class="main">

    <div class="header">
      <span>Панель администратора</span>
      <span>Поп Я.В.</span>
    </div>

    <div class="page">
      <h1>Категории</h1>

      <p id="error" class="empty hidden">Не удалось связаться с сервером. Проверь, что бэкенд запущен.</p>

      <form class="form-row" id="add-form">
        <input type="text" id="new-name" placeholder="Новая категория" required>
        <button>Добавить</button>
      </form>

      <table>
        <thead>
          <tr>
            <th>Название</th>
            <th>Объявлений</th>
            <th>Действия</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
